name: 脚本检查
on:
  push:
  pull_request:
jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 部署与测试脚本语法
        run: |
          bash -n scripts/deploy_verified_service.sh
          python -m py_compile tests/test_http.py
