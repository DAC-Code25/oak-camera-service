[Service]
WorkingDirectory=/home/nvidia/tenco-project/oak-camera-service
# systemd already stops the owned control group; do not match arbitrary command lines.
ExecStartPre=
ExecStart=
ExecStart=/home/nvidia/tenco-project/install/camera/oak_camera_service --bind 0.0.0.0 --port 18080 --snapshot-dir /home/nvidia/tenco-project/oak-camera-service/Capture --recording-dir /home/nvidia/tenco-project/oak-camera-service/Capture --width 960 --height 540 --fps 15 --sensor-fps 30 --record-width 1280 --record-height 720 --record-fps 30 --photo-fps 2 --settings-file /home/nvidia/tenco-project/oak-camera-service/camera-settings.json --jpeg-quality 70 --capture-jpeg-quality 90 --recording-crf 23
