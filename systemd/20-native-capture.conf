[Service]
WorkingDirectory=/home/nvidia/tenco-project
# systemd already stops the owned control group; do not match arbitrary command lines.
ExecStartPre=
ExecStart=
ExecStart=/bin/bash /home/nvidia/tenco-project/src/deployment/project.sh run camera isolated
Nice=10
CPUWeight=40
IOWeight=40
StandardOutput=null
StandardError=journal
